<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = '/login.html';
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Matassamu Vote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #0b132b; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1c2541; border: none; border-radius: 12px; }
        .form-control, .form-select { background-color: #0b132b !important; color: #ffffff !important; border: 1px solid #3a506b !important; }
        h2, h4, .card-title { color: #ffffff !important; }
        .form-label { color: #cbd5e1 !important; font-weight: 600; margin-bottom: 6px; }
        .form-control::placeholder { color: #64748b !important; }
        .form-control:focus, .form-select:focus { background-color: #0b132b; color: #fff; border-color: #5bc0be; box-shadow: none; }
        .btn-custom { background-color: #f77f00; color: white; font-weight: bold; border-radius: 8px; }
        .btn-custom:hover { background-color: #d66800; color: white; }
        .table-dark { background-color: #1c2541; color: #fff; }
        .badge-cat { background-color: #3a506b; padding: 6px 12px; border-radius: 6px; }

        /* Styles pour la zone Glisser-Déposer */
        .drop-zone {
            border: 2px dashed #3a506b;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background-color: #0b132b;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #5bc0be;
            background-color: #152238;
        }
        .preview-img {
            max-height: 80px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #5bc0be;
        }
        .candidate-thumb {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #3a506b;
        }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestion des Candidats</h2>
            <div>
                <a href="/dashboard.html" class="btn btn-outline-light btn-sm me-2">&larr; Retour au Dashboard</a>
                <button onclick="sessionStorage.removeItem('isLoggedIn'); window.location.href='/login.html';" class="btn btn-outline-danger btn-sm">
                    <i class="fa-solid fa-right-from-bracket"></i> Déconnexion
                </button>
            </div>
        </div>

        <!-- Formulaire d'Ajout / Modification -->
        <div class="card p-4 mb-4">
            <h4 id="formTitle">Ajouter / Modifier un candidat</h4>
            <form id="candidatForm" onsubmit="saveCandidat(event)">
                <input type="hidden" id="candidatId">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Code SMS (ex: 1 ou REST-01)</label>
                        <input type="text" id="codeSMS" name="code_sms" class="form-control" placeholder="1" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Catégorie</label>
                        <select id="categoryId" name="category_id" class="form-select" required>
                            <option value="1">Pâtisserie (PAT)</option>
                            <option value="2">Créateur (CREA)</option>
                            <option value="3">Restauration (REST)</option>
                            <option value="4">Entrepreneur (ENT)</option>
                            <option value="5">Artisan (ART)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nom Complet du Candidat</label>
                        <input type="text" id="nomCandidat" name="nom" class="form-control" placeholder="Nom et Prénom" required>
                    </div>

                    <!-- Zone Glisser / Déposer pour la Photo -->
                    <div class="col-12 mt-3">
                        <label class="form-label">Photo du Candidat</label>
                        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                            <p class="mb-1 text-light">📁 Glissez-déposez la photo ici ou <span class="text-info fw-bold">cliquez pour parcourir</span></p>
                            <small class="text-secondary">Formats acceptés : JPG, PNG, WEBP</small>
                            <input type="file" id="fileInput" name="photo" accept="image/*" class="d-none" onchange="previewImage(this.files[0])">
                            <div>
                                <img id="imagePreview" class="preview-img d-none" src="" alt="Aperçu">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-3 text-end">
                    <button type="button" id="cancelBtn" class="btn btn-secondary d-none me-2" onclick="resetForm()">Annuler</button>
                    <button type="submit" class="btn btn-custom px-4">Enregistrer le candidat</button>
                </div>
            </form>
        </div>

        <h4>Liste des Candidats</h4>
        <div class="table-responsive mt-3">
            <table class="table table-dark table-hover align-middle">
                <thead>
                    <tr>
                        <th>PHOTO</th>
                        <th>CODE</th>
                        <th>CATÉGORIE</th>
                        <th>NOM & PRÉNOM</th>
                        <th>VOTES</th>
                        <th class="text-end">ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="candidatsTable">
                    <tr><td colspan="6" class="text-center">Chargement des données...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allCandidats = [];
        let selectedFile = null;

        // --- GESTION DRAG & DROP ---
        const dropZone = document.getElementById('dropZone');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => e.preventDefault());
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'));
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'));
        });

        dropZone.addEventListener('drop', e => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                previewImage(files[0]);
                document.getElementById('fileInput').files = files;
            }
        });

        function previewImage(file) {
            if (!file) return;
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.getElementById('imagePreview');
                img.src = e.target.result;
                img.classList.remove('d-none');
            };
            reader.readAsDataURL(file);
        }

        // --- CHARGEMENT DES CANDIDATS ---
        async function loadCandidats() {
            try {
                const res = await fetch('/api/admin/candidats');
                const result = await res.json();
                if (result.success) {
                    allCandidats = result.data;
                    renderTable();
                }
            } catch (err) {
                console.error("Erreur de chargement:", err);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('candidatsTable');
            if (allCandidats.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">Aucun candidat trouvé</td></tr>';
                return;
            }

            tbody.innerHTML = allCandidats.map(c => {
                let photoTag = '<span class="badge bg-secondary">Aucune</span>';
                if (c.photo) {
                    // S'assure que le chemin commence par /uploads/
                    let photoPath = c.photo;
                    if (!photoPath.startsWith('/uploads/') && !photoPath.startsWith('uploads/')) {
                        photoPath = '/uploads/' + photoPath;
                    } else if (!photoPath.startsWith('/')) {
                        photoPath = '/' + photoPath;
                    }

                    photoTag = `<img src="${photoPath}?t=${new Date().getTime()}" class="candidate-thumb" alt="Photo" style="width: 45px; height: 45px; object-fit: cover; border-radius: 50%;" onerror="this.src='logo.png'">`;
                }

                return `
                    <tr>
                        <td>${photoTag}</td>
                        <td><strong>${c.code_vote || c.code_sms || '-'}</strong></td>
                        <td><span class="badge-cat">${c.category_name || c.nom_categorie || 'Catégorie'}</span></td>
                        <td>${c.nom}</td>
                        <td><span class="badge bg-warning text-dark">${c.nombre_votes || 0} votes</span></td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-primary me-2" onclick="editCandidat(${c.id})">Éditer</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCandidat(${c.id})">Supprimer</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function editCandidat(id) {
            const candidate = allCandidats.find(c => c.id === id);
            if (!candidate) return;

            document.getElementById('candidatId').value = candidate.id;
            document.getElementById('codeSMS').value = candidate.code_vote || candidate.code_sms || '';
            document.getElementById('categoryId').value = candidate.category_id;
            document.getElementById('nomCandidat').value = candidate.nom;

            if (candidate.photo) {
                const img = document.getElementById('imagePreview');
                img.src = candidate.photo.startsWith('/uploads/') ? candidate.photo : '/uploads/' + candidate.photo;
                img.classList.remove('d-none');
            } else {
                document.getElementById('imagePreview').classList.add('d-none');
            }

            document.getElementById('formTitle').innerText = "Modifier le candidat";
            document.getElementById('cancelBtn').classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('candidatId').value = '';
            document.getElementById('candidatForm').reset();
            document.getElementById('imagePreview').classList.add('d-none');
            selectedFile = null;
            document.getElementById('formTitle').innerText = "Ajouter / Modifier un candidat";
            document.getElementById('cancelBtn').classList.add('d-none');
        }

        // --- ENREGISTREMENT ---
        async function saveCandidat(e) {
            e.preventDefault();
            const id = document.getElementById('candidatId').value;
            const form = document.getElementById('candidatForm');
            const formData = new FormData(form);

            const url = id ? `/api/admin/candidats/${id}` : '/api/admin/candidats';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    body: formData
                });

                const result = await res.json();
                if (result.success || res.ok) {
                    resetForm();
                    loadCandidats();
                } else {
                    alert("Erreur : " + (result.message || "Une erreur est survenue"));
                }
            } catch (err) {
                console.error("Erreur de sauvegarde:", err);
            }
        }

        async function deleteCandidat(id) {
            if (!confirm("Voulez-vous vraiment supprimer ce candidat ?")) return;
            try {
                const res = await fetch(`/api/admin/candidats/${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.success) {
                    loadCandidats();
                }
            } catch (err) {
                console.error("Erreur lors de la suppression:", err);
            }
        }

        loadCandidats();
</script>
</body>
</html>
