<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration - VoteSMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b132b; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(245, 158, 11, 0.2); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-2xl relative overflow-hidden">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-amber-500/10 rounded-2xl border border-amber-500/30 flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-user-shield text-amber-400 text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-wide">Espace Administration</h1>
            <p class="text-slate-400 text-xs mt-1">Veuillez vous authentifier pour accéder à la gestion</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Identifiant / Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" id="username" required placeholder="admin" 
                           class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Mot de passe</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                </div>
            </div>

            <div id="errorMessage" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs text-center font-medium">
                Identifiants incorrects.
            </div>

            <button type="submit" 
                    class="w-full py-3.5 px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm rounded-xl shadow-lg shadow-amber-500/20 transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>Se connecter</span>
                <i class="fa-solid fa-right-to-bracket text-xs"></i>
            </button>
        </form>

        <div class="mt-8 pt-4 border-t border-slate-800/80 text-center text-[11px] text-slate-500">
            &copy; 2026 VoteSMS • Moov Niger Integration
        </div>
    </div>

    <script>
        // Si déjà connecté pour cette session, rediriger directement vers l'admin
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = '/admin.html';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errDiv = document.getElementById('errorMessage');

            // Vous pouvez personnaliser vos identifiants temporaires ici ou appeler votre API d'authentification
            if (user === 'admin' && pass === 'VoteSMS2026!Admin') {
                sessionStorage.setItem('isLoggedIn', 'true');
                window.location.href = '/admin.html';
            } else {
                errDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
